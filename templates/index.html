<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Phishing Detector</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; max-width: 500px; width: 100%; }
        h2 { color: #333; }
        input[type="text"] { width: 80%; padding: 12px; margin: 20px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { background-color: #007BFF; color: white; padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; transition: 0.3s; }
        button:hover { background-color: #0056b3; }
        .result { margin-top: 25px; padding: 15px; border-radius: 5px; font-weight: bold; font-size: 18px; }
        .safe { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .phishing { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🛡️ AI Phishing URL Detector</h2>
        <p>Enter a web address below to scan it for malicious patterns.</p>
        
        <form action="/predict" method="POST">
            <input type="text" name="url" placeholder="e.g., http://secure-login-paypal.com" required>
            <br>
            <button type="submit">Scan URL</button>
        </form>

        {% if prediction_text %}
            <div class="result {% if 'Safe' in prediction_text %}safe{% else %}phishing{% endif %}">
                <p><strong>URL:</strong> {{ original_url }}</p>
                <p><strong>Verdict:</strong> {{ prediction_text }}</p>
            </div>
        {% endif %}
    </div>

</body>
</html>
